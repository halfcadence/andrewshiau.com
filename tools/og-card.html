<!DOCTYPE html>
<!-- SOURCE FOR public/og.png — the social unfurl card, 1200×630.
     Not in src/pages/: that would publish it as a real route and put it in the sitemap,
     and a bare card page is not something a reader should ever land on. It lives here
     instead, and the regeneration recipe in README.md copies it into public/ for the
     length of one screenshot.
     It must be served (not opened as file://) because the card is set in Graphik and the
     woff2 files only load same-origin — a file:// copy silently falls back to Helvetica
     and the card stops being cut from the real system.
     Light palette hardcoded: an unfurl card is a fixed raster, so it can't answer a
     reader's colour scheme the way the site does. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og card</title>
<style>
  @font-face{font-family:"Graphik";font-weight:400;font-display:block;src:url("/fonts/Graphik-400-Regular.woff2") format("woff2")}
  @font-face{font-family:"Graphik";font-weight:600;font-display:block;src:url("/fonts/Graphik-600-Semibold.woff2") format("woff2")}
  @font-face{font-family:"Graphik";font-weight:700;font-display:block;src:url("/fonts/Graphik-700-Bold.woff2") format("woff2")}
  /* The real hexes from global.css, light only. --design navy, --build olive, warm paper. */
  :root{--paper:#f4f3ef;--ink:#141412;--dim:#5f5e57;--faint:#6e6d64;--line:#d5d4cd;
    --design:#14306b;--build:#5c6b12;
    --sans:"Graphik","Helvetica Neue",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--paper)}
  /* Exactly 1200×630 so the capture needs no crop. */
  .card{width:1200px;height:630px;background:var(--paper);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  /* Masthead: the mark and the domain on one 2px rule — the site's own mast, at scale. */
  .mast{display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--ink);padding-bottom:22px}
  .mast svg{display:block;width:52px;height:52px}
  .mast .dom{font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  /* The claim, at the h1's tracking. Two clauses, two hues — the same and only place
     colour enters body copy on the site itself. */
  .say{font-size:60px;line-height:1.04;font-weight:700;letter-spacing:-0.03em;max-width:19em}
  .t-design{color:var(--design)}
  .t-build{color:var(--build)}
  /* The ledger, three facts. Hierarchy from size and position — never colour. */
  .led{display:flex;gap:56px;border-top:1px solid var(--line);padding-top:20px}
  .led .k{display:block;font-size:15px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .led .v{display:block;font-size:23px;line-height:1.24;font-weight:600;letter-spacing:-0.01em}
</style>
</head>
<body>
  <div class="card">
    <div class="mast">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <line x1="10" y1="10" x2="22" y2="22" stroke="#141412" stroke-width="1.5"/>
        <circle cx="10" cy="10" r="5" fill="#14306b"/>
        <circle cx="22" cy="22" r="5" fill="#5c6b12"/>
      </svg>
      <span class="dom">andrewshiau.com</span>
    </div>

    <h1 class="say">Andrew Shiau is a frontend engineer who designs and builds.
      <span class="t-design">Taste finds the simplest form</span>,
      <span class="t-build">engineering proves the simplest solution</span>.</h1>

    <div class="led">
      <div><span class="k">Role</span><span class="v">Frontend engineer</span></div>
      <div><span class="k">Where</span><span class="v">Amazon · 2023–present</span></div>
      <div><span class="k">Set in</span><span class="v">A 12-column grid</span></div>
    </div>
  </div>
</body>
</html>
