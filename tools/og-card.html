<!DOCTYPE html>
<!-- SOURCE FOR public/og.png — the social unfurl card, 1200×630.
     Not in src/pages/: that would publish it as a real route and put it in the sitemap,
     and a bare card page is not something a reader should ever land on. It lives here
     instead, and `scripts/og-shoot.py` copies it into dist/ for the length of one capture.

     ── REBUILT IN THE MONO SYSTEM, 2026-08-11. Layout.astro carried a `KNOWN STALE` note on
     this file and it was right: the card was Graphik at the old seven-step ramp, with SIX
     things in it the site had since stopped saying. Found because the card shipped as the
     LinkedIn Featured thumbnail — the first place it has ever been seen at full size beside
     the live site.
     What was wrong, each a fact rather than a preference:
       1. GRAPHIK. Retired — its four woff2 files are deleted from public/fonts/ and no page
          sets it. The card was rendering in whatever sans the shooting machine had.
       2. OLIVE #5c6b12. Retired ENTIRELY (global.css: "The old --build (olive #5c6b12) is
          gone entirely"). --design, --build and --accent are one navy now, so a two-hue card
          drew a distinction the site no longer makes.
       3. THREE TYPE SIZES AND BOLD (60/23/15 at weights 600–700). The site has ONE size and
          one emphasis weight (500). A card in four weights is not cut from it.
       4. UPPERCASE + .14em/.16em TRACKING on the labels and the domain. The mono pass deleted
          small-caps-plus-tracking everywhere; a hung label in --faint is the device now.
       5. THE MARK'S GEOMETRY. Two solid circles joined centre-to-centre (10,10)→(22,22) in
          the two hues. The figure is a hollow RING and a solid DISC, both r=5 stroke 1.8,
          rule trimmed to each path (13.54→18.46), drawn in currentColor — because
          outline-vs-fill is the signal that survives greyscale, which is the whole reason the
          hues came out of the mark. See MarkFigure.astro.
       6. "Amazon · 2023–present" — two years stale, in a three-cell ledger that otherwise
          restated the claim above it.

     WHAT IT SAYS NOW is the index's own h1, verbatim, because that sentence IS the site's
     first line — a card that paraphrases the page it links to is a second copy to keep in
     sync. `scripts/og-shoot.py` asserts the two still match and fails if they drift.

     It must be SERVED, not opened as file://: the woff2 files are referenced root-absolute
     and only load same-origin, so a file:// copy silently falls back to a system mono and the
     card stops being cut from the real system. og-shoot.py binds 127.0.0.1 only, in the
     foreground, and closes in a `finally` — never 0.0.0.0 on the devbox.
     Light palette hardcoded: an unfurl card is a fixed raster, so it cannot answer a reader's
     colour scheme the way the site does. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og card</title>
<style>
  /* The site's faces, root-absolute like every page (hence: must be served). The card uses
     Regular and Medium only — one size, one emphasis weight, same as the site. */
  @font-face{font-family:"Plex";font-weight:400;font-style:normal;font-display:block;
    src:url("/fonts/IBMPlexMono-Regular.woff2") format("woff2")}
  @font-face{font-family:"Plex";font-weight:500;font-style:normal;font-display:block;
    src:url("/fonts/IBMPlexMono-Medium.woff2") format("woff2")}

  /* The real hexes from global.css, light colourway only. ONE accent: --design is --build is
     --accent, all #14306b (11.36:1 on paper). No olive. */
  :root{
    --paper:#f4f3ef; --ink:#141412; --dim:#5f5e57; --faint:#6e6d64; --line:#d5d4cd;
    --accent:#14306b;
    --mono:"Plex",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--paper)}

  /* Exactly 1200×630 so the capture needs no crop.
     ── THE SCALE IS THE SITE'S, MULTIPLIED — not redesigned. The site is 15/28. A card read
     at thumbnail size in a feed needs the claim larger than that to survive, so the claim is
     38/52 and everything else is 19/32: TWO sizes, one more than the site has and the fewest
     a 1200px raster can work with. At a single size the claim would be either illegible in a
     thumbnail or the only thing that fits on the card.
     The small line is exactly 19/32 — the site's own 15/28 ratio (1.87) at 1.68, close enough
     that the rhythm reads as the same system; the display line takes tighter leading (1.37),
     which is the one place a scale legitimately departs from its body ratio. */
  .card{width:1200px;height:630px;background:var(--paper);color:var(--ink);
    font:400 19px/32px var(--mono);
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
    padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}

  /* THE MAST: the figure and the domain on the site's 2px rule. No uppercase, no tracking —
     the domain is set as it would be in the colophon, in --dim. */
  .mast{display:flex;align-items:center;justify-content:space-between;
    border-bottom:2px solid var(--ink);padding-bottom:20px}
  /* ── 64px, NOT 44. At 44 in a 1200px card the figure read as a speck with a hairline ring —
     judged by looking at the render, which is the only instrument for this. The figure's
     viewBox is 32 units and its ring stroke is 1.8 of them, so the painted ring is
     (1.8/32)·size: 2.5px at 44 and 3.6px at 64. Against a 2px mast rule and 38px type, 2.5px
     read thinner than the rule beneath it, which inverted the hierarchy — the mark is the
     first object on the card and was the lightest mark on it.
     64 is where the ring's stroke clears the mast rule it sits on (3.6 > 2) and the disc reads
     as a disc rather than a dot. It is also the site's own relationship at scale: the index row
     marker is 18px against 15px type (1.2×), and 64 against 38px type is 1.68× — a masthead
     figure earns more than a row marker. */
  .mast .fig{display:block;width:64px;height:64px;color:var(--ink)}
  .mast .dom{color:var(--dim)}

  /* THE CLAIM — the index's h1, verbatim, at weight 400 like the page's own statement
     (`.statement{font-weight:400}`). NOT bold: the site's h1 is not bold, and a bold card in
     front of a not-bold page is the same mismatch as the wrong typeface.
     34ch holds it to four lines at this size — measured on the render, not guessed. */
  .say{font-size:38px;line-height:52px;font-weight:400;letter-spacing:-0.005em;
    max-width:34ch}

  /* THE FOOT: one hung label and one value on the site's hairline. The old three-cell
     ROLE / WHERE / SET IN ledger is gone — it restated the claim and carried a stale date.
     What survives is the one fact the claim doesn't contain: what I'm doing now, in the
     index's own words. 12ch label axis, --faint label, --ink value, same 19/32. */
  .foot{display:grid;grid-template-columns:12ch 1fr;column-gap:2ch;
    border-top:1px solid var(--line);padding-top:20px}
  .foot .k{color:var(--faint)}
  .foot .v{color:var(--ink)}
</style>
</head>
<body>
  <div class="card">
    <div class="mast">
      <!-- THE FIGURE, geometry copied from MarkFigure.astro's `both` case EXACTLY: ring and
           disc both r=5 stroke-width 1.8, rule trimmed to each circle's PATH rather than its
           outer edge (10 + 5·0.70711 = 13.54; 22 − 5·0.70711 = 18.46), all in currentColor.
           This is a THIRD hand copy of the figure (MarkFigure.astro and public/favicon.svg
           are the others), so og-shoot.py diffs these six numbers against MarkFigure.astro
           and fails on drift — the same guard /system/ applies to the favicon. -->
      <svg class="fig" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <line x1="13.54" y1="13.54" x2="18.46" y2="18.46"
              stroke="currentColor" stroke-width="1.5"/>
        <circle cx="10" cy="10" r="5" fill="none"
                stroke="currentColor" stroke-width="1.8"/>
        <circle cx="22" cy="22" r="5" fill="currentColor"
                stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span class="dom">andrewshiau.com</span>
    </div>

    <!-- The index's h1, verbatim. Asserted against src/pages/index.astro by og-shoot.py. -->
    <h1 class="say">Hi, I'm Andrew Shiau, frontend engineer who designs and builds. I value
      simplicity, curiosity and kindness.</h1>

    <!-- The `Currently` row from the index panel, verbatim. Also asserted. -->
    <div class="foot">
      <span class="k">Currently</span>
      <span class="v">Designing the Amazon store with AI.</span>
    </div>
  </div>
</body>
</html>
