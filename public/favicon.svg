<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg{fill:#f4f3ef}
    .rule{stroke:#141412}
    .design{fill:#14306b}
    .build{fill:#5c6b12}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141413}
      .rule{stroke:#f0efe8}
      .design{fill:#6ea8ff}
      .build{fill:#b9cc4a}
    }
  </style>
  <rect class="bg" width="32" height="32"/>
  <line class="rule" x1="10" y1="10" x2="22" y2="22" stroke-width="1.5"/>
  <circle class="design" cx="10" cy="10" r="5"/>
  <circle class="build" cx="22" cy="22" r="5"/>
</svg>
