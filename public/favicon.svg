<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- THE FAVICON — the same drawing as the page, in ink on paper (chooser:
       andrewshiau-mark-options, Q4/02 — "the greyscale figure, join fixed").
       This is a SECOND HAND COPY of src/components/MarkFigure.astro. It cannot import, so it
       carries its own hexes; the geometry below must match that file exactly. Change one,
       change both.
       Hollow ring, solid disc, and the rule landing on each circle's PATH so it overlaps the
       stroke it meets.
       BOTH OBJECTS ARE r="5" WITH THE SAME 1.8 STROKE, so both reach 5.9 and the pair is 11.8
       units across. The disc is stroked in the colour it is filled with — invisible against its
       own fill, so it looks like a plain disc while sharing the ring's geometry exactly.
       It was r="5" unstroked, which reached only 5.0 and made the disc 15% smaller (a stroke is
       centred on its path and hangs half outside it, so equal radii are NOT equal sizes unless
       both are stroked). The arithmetic is in MarkFigure.astro.
       THE JOIN IS 13.54 → 18.46, the path (r=5), NOT the outer edge (5.9 → 14.17/17.83). At the
       outer edge the rule was tangent to each object rather than overlapping it, and tangency
       reads as a gap: "the bars are a tiny bit short and dont visibly connect at big sizes."
       This matters MORE here than on the page, because a favicon is where a hairline gap
       disappears into one grey pixel. Do not shorten it back.
       NO HUES. The page's mark is currentColor throughout — outline vs. fill is the signal now,
       not navy vs. olive — so the tab is the same figure in one colour, and `.design` / `.build`
       are gone from this file. The two-hue version was legible at 16px only because the hues
       differed; a reader in greyscale, or in a dark tab strip, got two identical dots.
       The known cost, accepted when this option was picked: 1.8 units of a 32-unit box is 0.9
       device pixels at 16px, so the ring is drawn at sub-pixel weight and a browser will
       antialias it grey. It reads as a lighter dot beside a solid one, which is still the right
       distinction — and at 32px (bookmark bar, tab hover, history) it is exactly the page's
       figure.
       NO BACKGROUND, EITHER MODE. Annotation: "can the light mode favicon not have bg (doesn't
       need it) — actually if the dark mode one is inverse maybe it doesn't need either."
       Right on both counts, and the second is the reason: the ink hex and the paper hex swap
       between the two schemes, so the `<rect>` was always painting the same colour the tab strip
       was already painting behind it. It drew nothing in either mode and cost a 32×32 fill.
       Transparent is also strictly better than matching: a browser tab strip is not `--paper`
       (Chrome's inactive tab is #dee1e6, its dark tab #35363a), so the rect was a rectangle of
       *nearly* the right colour — which is visible as a faint square when it is a hair off, and
       is exactly what "doesn't need it" catches. On transparency the figure sits on whatever the
       browser draws, which is what every well-made favicon does.
       `.bg` is deleted rather than set to `fill:none`: a rect that paints nothing is still a rect. -->
  <style>
    .fg{fill:#141412}
    .st{stroke:#141412}
    @media (prefers-color-scheme: dark){
      .fg{fill:#f0efe8}
      .st{stroke:#f0efe8}
    }
  </style>
  <line class="st" x1="13.54" y1="13.54" x2="18.46" y2="18.46" stroke-width="1.5"/>
  <circle class="st" cx="10" cy="10" r="5" fill="none" stroke-width="1.8"/>
  <circle class="fg st" cx="22" cy="22" r="5" stroke-width="1.8"/>
</svg>
